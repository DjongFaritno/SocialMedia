name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build NSIS installer
        run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packages
        run: node scripts/verify-package.cjs windows
      - name: Smoke test packaged app
        timeout-minutes: 3
        shell: pwsh
        run: |
          $app = Start-Process -FilePath './dist/win-unpacked/DuoChat.exe' -ArgumentList '--smoke' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "DuoChat smoke test failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS Intel + Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build universal DMG and ZIP
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packages
        run: node scripts/verify-package.cjs macos
      - name: Smoke test packaged app
        timeout-minutes: 3
        run: ./dist/mac-universal/DuoChat.app/Contents/MacOS/DuoChat --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build AppImage and Debian package
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packages and prepare Fedora installer
        run: |
          node scripts/verify-package.cjs linux
          node scripts/prepare-linux-release.cjs
          bash -n dist/install-fedora.sh
      - name: Smoke test packaged app
        timeout-minutes: 3
        # This flag is only for the disposable CI runner, never the installed launcher.
        run: xvfb-run -a ./dist/linux-unpacked/duochat-desktop --no-sandbox --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/install-fedora.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish prototype downloads
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: duochat-*
          path: release-assets
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          node scripts/release-checksums.cjs release-assets
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [ "$release_commit" != "$GITHUB_SHA" ]; then
              echo 'Version already published for another commit. Bump package.json version before publishing.' >&2
              exit 1
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "DuoChat ${version} — Desktop prototype" --notes-file docs/release-notes.md
          fi
          gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
