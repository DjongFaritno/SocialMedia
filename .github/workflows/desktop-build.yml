name: Build desktop installers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'build/**'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build NSIS installer
        run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packages
        run: node scripts/verify-package.cjs windows
      - name: Smoke test packaged app
        timeout-minutes: 3
        shell: pwsh
        run: |
          $duoStdout = Join-Path $env:RUNNER_TEMP 'duochat-smoke-stdout.log'
          $duoStderr = Join-Path $env:RUNNER_TEMP 'duochat-smoke-stderr.log'
          $app = Start-Process -FilePath './dist/win-unpacked/DuoChat.exe' -ArgumentList '--smoke' -RedirectStandardOutput $duoStdout -RedirectStandardError $duoStderr -PassThru -Wait
          Get-Content -Path $duoStdout -ErrorAction SilentlyContinue
          Get-Content -Path $duoStderr -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { throw "DuoChat smoke test failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS Intel + Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build universal DMG and ZIP
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # package.json uses identity '-' (ad-hoc), without signing secrets.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify packages and macOS code signature
        run: |
          node scripts/verify-package.cjs macos
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/DuoChat.app
          codesign -d --entitlements :- dist/mac-universal/DuoChat.app > /tmp/duochat-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' /tmp/duochat-entitlements.plist | grep true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.camera' /tmp/duochat-entitlements.plist | grep true
      - name: Smoke test packaged app
        timeout-minutes: 3
        run: ./dist/mac-universal/DuoChat.app/Contents/MacOS/DuoChat --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Fast Chromium interaction smoke before packaging
        timeout-minutes: 3
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" npm run smoke -- --no-sandbox --disable-gpu --skip-capture
      - name: Build AppImage and Debian package
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packages and prepare Fedora installer
        run: |
          node scripts/verify-package.cjs linux
          node scripts/prepare-linux-release.cjs
          bash -n dist/install-fedora.sh
      - name: Install Electron test runtime
        run: node node_modules/electron/install.js
      - name: Test service-worker notification permissions
        timeout-minutes: 2
        run: xvfb-run -a ./node_modules/electron/dist/electron scripts/notification-smoke.cjs --no-sandbox --disable-gpu
      - name: Verify Instagram Facebook login navigation
        timeout-minutes: 2
        run: xvfb-run -a ./node_modules/electron/dist/electron scripts/auth-smoke.cjs --no-sandbox --disable-gpu
      - name: Verify updater download integrity
        timeout-minutes: 2
        run: xvfb-run -a ./node_modules/electron/dist/electron scripts/update-smoke.cjs --no-sandbox --disable-gpu
      - name: Verify second launch reuses existing window
        timeout-minutes: 2
        run: xvfb-run -a ./node_modules/electron/dist/electron scripts/single-instance-smoke.cjs --no-sandbox --disable-gpu
      - name: Smoke test packaged app
        timeout-minutes: 3
        # This flag is only for the disposable CI runner, never the installed launcher.
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" ./dist/linux-unpacked/duochat-desktop --disable-gpu --no-sandbox --smoke --skip-capture
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/install-fedora.sh
            dist/latest-linux.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Publish verified desktop release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install metadata parser without build runtimes
        run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: duochat-*
          path: release-assets
          merge-multiple: true
      - name: Validate all installers and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-checksums.cjs release-assets
          node scripts/publish-release.cjs release-assets
